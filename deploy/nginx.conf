# Teintérior — configuration nginx.
#
# À adapter : `server_name` et le chemin `root`.
# Installation : copier dans /etc/nginx/sites-available/teinterior,
# puis `ln -s` vers /etc/nginx/sites-enabled/, `nginx -t`, `systemctl reload nginx`.
#
# Le HTTPS est ajouté automatiquement par `certbot --nginx` (voir DEPLOIEMENT.md),
# qui réécrit ce fichier pour ajouter le bloc 443 et la redirection depuis le 80.
# Pensez à ajouter `http2 on;` dans le bloc 443 qu'il aura créé : voir plus bas.

server {
    listen 80;
    listen [::]:80;

    # HTTP/2 ne s'applique qu'en HTTPS. Une fois certbot passé, ajoutez cette
    # ligne dans le bloc `listen 443 ssl` qu'il a créé :
    #
    #     http2 on;
    #
    # Sur nginx antérieur à 1.25, la forme est `listen 443 ssl http2;`.
    # Le site charge une douzaine de fichiers de polices en parallèle : sans
    # multiplexage, le navigateur les met en file d'attente six par six.

    server_name teinterior.fr www.teinterior.fr;

    root /var/www/teinterior;
    index index.html;

    # Les pages publiques sont pré-rendues au build : chaque route a son propre
    # fichier (`/prestations/index.html`, `/detailing/strasbourg/index.html`…).
    # Une URL qui ne correspond à rien doit répondre 404 — et non 200 avec une
    # page d'erreur, ce qui laisse Google indexer autant de pages vides qu'il
    # existe de fautes de frappe et de vieux liens.
    #
    # `expires -1` envoie `Cache-Control: no-cache` : les pages HTML pointent
    # vers des fichiers d'assets dont le nom change à chaque déploiement, une
    # page gardée en cache renverrait vers des fichiers supprimés.
    #
    # On utilise `expires` et non `add_header` : nginx ignore *tous* les
    # `add_header` hérités dès qu'un bloc en déclare un à lui, ce qui ferait
    # disparaître les en-têtes de sécurité définis plus bas.
    location / {
        try_files $uri $uri/index.html $uri/ =404;
        expires -1;
    }

    error_page 404 /404/index.html;
    location = /404/index.html {
        internal;
        # `expires` ne s'applique qu'aux réponses 2xx et 3xx : sur une 404 il
        # ne produit rien, d'où l'`add_header` — et la répétition qui suit.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Les fiches véhicule sont créées depuis le panel, donc après le build :
    # leurs URL n'ont pas de fichier pré-rendu. Elles retombent sur la coquille
    # vide, que le routeur client remplit. C'est le prix à payer pour un
    # catalogue modifiable sans reconstruire le site : une référence inexistante
    # répond 200 et affiche la page d'erreur, au lieu d'un vrai 404.
    location /vehicules/ {
        try_files $uri $uri/index.html /app.html;
        expires -1;
    }

    # Le panel n'est pas pré-rendu : sa racine doit rester vide, sinon React
    # tenterait de reprendre le balisage de l'accueil pour une autre page.
    location /admin {
        try_files $uri /app.html;
        expires -1;
    }

    # Photos des véhicules, déposées depuis le panel d'administration. nginx les
    # sert directement depuis le disque : plus rapide que de les faire transiter
    # par Node. Le nom de chaque fichier est aléatoire et son contenu ne change
    # jamais, d'où la mise en cache longue.
    location /media/ {
        alias /var/lib/teinterior/media/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Répétés parce que ce bloc déclare son propre `add_header` : nginx
        # cesse alors d'hériter de ceux du serveur.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
        try_files $uri =404;
    }

    # L'API de contenus tourne en local sur le port 8787 : c'est elle qui sert
    # les contenus au site et reçoit les modifications du panel.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Permet à l'API de limiter les tentatives de connexion par adresse.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Les fichiers d'assets portent un hash dans leur nom : ils ne changent
    # jamais à contenu identique, on peut donc les mettre en cache longtemps.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Voir la remarque sur l'héritage des `add_header` dans /media/.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    location ~* ^/(favicon\.svg|favicon\.ico|apple-touch-icon\.png|icon-\d+\.png|site\.webmanifest)$ {
        expires 7d;
        access_log off;
    }

    # --- Compression -------------------------------------------------------
    #
    # Le HTML pré-rendu pèse une centaine de kilooctets et se compresse d'un
    # facteur sept : sans compression, le pré-rendu coûte plus de temps de
    # téléchargement qu'il n'en fait gagner au rendu.

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml;

    # Brotli compresse le texte 15 à 20 % de mieux que gzip. Il demande le
    # module `libnginx-mod-brotli` (`apt install libnginx-mod-brotli`) ; si le
    # module n'est pas installé, nginx refuse de démarrer sur ces directives —
    # laissez-les commentées tant que `nginx -t` ne passe pas.
    #
    # brotli on;
    # brotli_comp_level 5;
    # brotli_min_length 1024;
    # brotli_types
    #     text/plain
    #     text/css
    #     text/xml
    #     text/javascript
    #     application/javascript
    #     application/json
    #     application/manifest+json
    #     application/xml
    #     image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Le panel d'administration s'authentifie auprès de l'API : aucun
    # identifiant ne circule dans le JavaScript, et /admin peut rester public.
    # Pour restreindre malgré tout l'accès à votre connexion, ajoutez dans le
    # bloc `location /admin` ci-dessus :
    #
    #     allow 203.0.113.42;
    #     deny all;

    # Les photos sont réduites par le navigateur avant l'envoi (environ 300 Ko),
    # mais on garde de la marge.
    client_max_body_size 10m;
}
