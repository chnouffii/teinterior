# Teintérior — configuration nginx pour un site statique React (routage client).
#
# À adapter : `server_name` et le chemin `root`.
# Installation : copier dans /etc/nginx/sites-available/teinterior,
# puis `ln -s` vers /etc/nginx/sites-enabled/, `nginx -t`, `systemctl reload nginx`.
#
# Le HTTPS est ajouté automatiquement par `certbot --nginx` (voir DEPLOIEMENT.md),
# qui réécrit ce fichier pour ajouter le bloc 443 et la redirection depuis le 80.

server {
    listen 80;
    listen [::]:80;

    server_name teinterior.fr www.teinterior.fr;

    root /var/www/teinterior;
    index index.html;

    # Le routage se fait côté client : toute URL inconnue doit renvoyer
    # index.html, sinon /prestations et /vehicules répondent 404 en accès direct
    # ou au rafraîchissement.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Photos des véhicules, déposées depuis le panel d'administration. nginx les
    # sert directement depuis le disque : plus rapide que de les faire transiter
    # par Node. Le nom de chaque fichier est aléatoire et son contenu ne change
    # jamais, d'où la mise en cache longue.
    location /media/ {
        alias /var/lib/teinterior/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # L'API de contenus tourne en local sur le port 8787 : c'est elle qui sert
    # les contenus au site et reçoit les modifications du panel.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Permet à l'API de limiter les tentatives de connexion par adresse.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Les fichiers d'assets portent un hash dans leur nom : ils ne changent
    # jamais à contenu identique, on peut donc les mettre en cache longtemps.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html ne doit jamais être mis en cache : c'est lui qui pointe vers
    # la dernière version des assets après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Le panel d'administration s'authentifie désormais auprès de l'API : aucun
    # identifiant ne circule dans le JavaScript, et /admin peut rester public.
    # Pour restreindre malgré tout l'accès à votre connexion, décommentez et
    # remplacez par votre adresse IP.
    # location /admin {
    #     allow 203.0.113.42;
    #     deny all;
    #     try_files $uri $uri/ /index.html;
    # }

    # Les photos sont réduites par le navigateur avant l'envoi (environ 300 Ko),
    # mais on garde de la marge.
    client_max_body_size 10m;
}
