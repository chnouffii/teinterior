# Teintérior — bloc serveur nginx.
#
# À adapter : `server_name` et le chemin `root`.
#
# Les règles du site (routage, cache, compression, en-têtes) ne sont pas ici :
# elles vivent dans `teinterior-locations.conf`, inclus ci-dessous. Certbot
# réécrit et déplace les lignes `listen` et `server_name` quand il installe un
# certificat ; garder les deux dans le même fichier obligeait à recopier ses
# réglages TLS à la main à chaque mise à jour.
#
# Installation :
#     sudo cp deploy/teinterior-locations.conf /etc/nginx/snippets/teinterior.conf
#     sudo cp deploy/nginx.conf /etc/nginx/sites-available/teinterior
#     sudo ln -sf /etc/nginx/sites-available/teinterior /etc/nginx/sites-enabled/
#     sudo nginx -t && sudo systemctl reload nginx
#
# Puis `sudo certbot --nginx -d teinterior.fr -d www.teinterior.fr`, qui
# ajoutera le HTTPS et la redirection. Ce fichier-ci devient alors le vôtre :
# ne le recopiez plus. Seul `teinterior-locations.conf` se met à jour ensuite.

server {
    listen 80;
    listen [::]:80;

    server_name teinterior.fr www.teinterior.fr;

    root /var/www/teinterior;
    index index.html;

    include snippets/teinterior.conf;
}

# Une fois certbot passé, votre fichier ressemblera à ceci — deux blocs, le
# second redirigeant vers HTTPS.
#
# Activez HTTP/2 dans le bloc 443 : le site charge une douzaine de fichiers de
# polices, et sans multiplexage le navigateur les met en file d'attente six par
# six. La forme dépend de la version — vérifiez-la avec `nginx -v` :
#
#     nginx 1.25 et plus  →  listen 443 ssl;  puis une ligne  http2 on;
#     nginx 1.24 et moins →  listen 443 ssl http2;
#
# La directive `http2 on;` n'existe pas avant 1.25 : sur une version plus
# ancienne, `nginx -t` échoue avec « unknown directive "http2" ». Ubuntu 24.04
# livre nginx 1.24, c'est donc la seconde forme qui s'applique le plus souvent.
#
#     server {
#         server_name teinterior.fr www.teinterior.fr;
#         root /var/www/teinterior;
#         index index.html;
#
#         include snippets/teinterior.conf;
#
#         listen 443 ssl http2;              # « http2 on; » à la place sur nginx >= 1.25
#         listen [::]:443 ssl ipv6only=on;
#         ssl_certificate     /etc/letsencrypt/live/teinterior.fr/fullchain.pem;
#         ssl_certificate_key /etc/letsencrypt/live/teinterior.fr/privkey.pem;
#         include /etc/letsencrypt/options-ssl-nginx.conf;
#         ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#     }
#
#     server {
#         if ($host = www.teinterior.fr) { return 301 https://$host$request_uri; }
#         if ($host = teinterior.fr)     { return 301 https://$host$request_uri; }
#
#         listen 80;
#         listen [::]:80;
#         server_name teinterior.fr www.teinterior.fr;
#         return 404;
#     }
