# Teintérior — à quoi ressemble /etc/nginx/sites-available/teinterior une fois
# certbot passé. Fourni comme repère : ce fichier-là est le vôtre, il ne se
# recopie pas depuis le dépôt.
#
# Les lignes `http2` supposent nginx 1.24 ou antérieur (Ubuntu 24.04). À partir
# de nginx 1.25, retirez `http2` des lignes `listen` et ajoutez `http2 on;` dans
# le bloc — vérifiez avec `nginx -v`.
#
# Les règles du site (routage, cache, compression, en-têtes de sécurité) sont
# dans /etc/nginx/snippets/teinterior.conf, mis à jour depuis le dépôt par :
#     sudo cp /opt/teinterior/deploy/teinterior-locations.conf /etc/nginx/snippets/teinterior.conf
#     sudo nginx -t && sudo systemctl reload nginx
#
# Les lignes ci-dessous sont les vôtres : certbot les gère, ne les recopiez pas
# depuis le dépôt.

server {
    server_name teinterior.fr www.teinterior.fr;

    root /var/www/teinterior;
    index index.html;

    include snippets/teinterior.conf;

    listen [::]:443 ssl ipv6only=on http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/teinterior.fr/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/teinterior.fr/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.teinterior.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = teinterior.fr) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name teinterior.fr www.teinterior.fr;
    return 404; # managed by Certbot
}
