<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Teintérior">
  <!--
    Monogramme, pas le logo complet.

    Le logo mesure 300 px et contient la voiture (205 × 37 px) et le mot
    « Teintérior ». Réduits à 16 px — la taille réelle d'un favicon dans un
    onglet — la voiture fait trois pixels de haut et le mot devient une tache
    grise. Le « T » laiton reste lisible et reprend l'accent du site ; le logo
    complet sert aux icônes de 180 px et plus, où il se lit vraiment.
  -->
  <defs>
    <linearGradient id="laiton" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2CE85" />
      <stop offset="100%" stop-color="#D9A441" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="#0A0D12" />
  <g transform="translate(35.5 0) skewX(-9) translate(-35.5 0)">
    <path d="M13 14h39v10.5H36.9V47H28.1V24.5H13V14Z" fill="url(#laiton)" />
  </g>
  <rect x="13" y="51.5" width="38" height="3.2" rx="1.6" fill="#CBD5E1" opacity="0.55" />
</svg>
